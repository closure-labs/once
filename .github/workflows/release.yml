name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
        with:
          extra-conf: |
            experimental-features = nix-command flakes ca-derivations
            extra-substituters = https://once.cachix.org
            extra-trusted-public-keys = once.cachix.org-1:UvTATbX24Ign6jp8p/RhF22vwnD/1bHXV3EEg2AMbZY=

      - name: Require tested Nix 2.35.3
        shell: bash
        run: |
          version=$(nix --version)
          test "${version##* }" = 2.35.3

      - name: Configure Once Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: once
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$release_version" = "$cargo_version"
          grep -F "version = \"$release_version\";" nix/package.nix

      - name: Build release package
        run: nix build .#once --print-build-logs

      - name: Create archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          archive="once-${release_version}-x86_64-linux"
          mkdir -p "dist/$archive/bin"
          cp -L result/bin/once "dist/$archive/bin/once"
          cp COPYRIGHT LICENSE README.md "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          pushd dist > /dev/null
          sha256sum "$archive.tar.gz" > "$archive.tar.gz.sha256"
          popd > /dev/null

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256

      - name: Publish tagged flake to FlakeHub
        uses: DeterminateSystems/flakehub-push@f960928265d16ba43227dfd48812a8b1de17a441 # main 2026-08-23
        with:
          name: closure-labs/once
          repository: closure-labs/once
          visibility: public
          tag: ${{ github.event.release.tag_name }}
          spdx-expression: Apache-2.0
