name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Determinate Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes ca-derivations

      - name: Require Nix 2.35+
        shell: bash
        run: |
          set -euo pipefail
          version=$(nix --version | awk '{print $NF}')
          nix eval --expr "assert builtins.compareVersions \"$version\" \"2.35.0\" >= 0; true"

      - name: Format
        run: nix develop -c cargo fmt --all -- --check

      - name: Lint
        run: nix develop -c cargo clippy --all-targets --all-features -- -D warnings

      - name: Lint GitHub Actions workflows
        run: |
          nix develop -c actionlint
          nix develop -c actionlint examples/once-policy/.github/workflows/ci.yml

      - name: Lint GitHub Action wrapper
        run: nix develop -c shellcheck scripts/github-action.sh tests/github-action.sh

      - name: Test
        run: nix develop -c cargo test

      - name: Test GitHub Action wrapper
        run: nix develop -c bash tests/github-action.sh

      - name: Verify minimum community Nix release
        env:
          NIX_CONFIG: extra-experimental-features = nix-command flakes ca-derivations
          NIXPKGS_NIX_REVISION: 2c423e03bbafcff28bfadc6781a4a8257f205cb5
        run: |
          nix shell \
            "github:NixOS/nixpkgs/$NIXPKGS_NIX_REVISION#nixVersions.latest" \
            -c ./target/debug/once --json doctor

      - name: Verify protected policy bootstrap
        env:
          ONCE_POLICY_REVISION: 5a4234004dc9948a1d45d462f947b10411d91a33
        run: |
          nix develop -c ./target/debug/once \
            --policy-flake "github:closure-labs/once-policy/$ONCE_POLICY_REVISION" \
            --policy-revision "$ONCE_POLICY_REVISION" \
            --json doctor

      - name: Exercise reusable GitHub Action
        id: reusable-once
        uses: ./
        with:
          command: doctor
          policy-flake: github:closure-labs/once-policy/5a4234004dc9948a1d45d462f947b10411d91a33
          policy-revision: 5a4234004dc9948a1d45d462f947b10411d91a33
          install-nix: "false"

      - name: Verify reusable Action outputs
        env:
          ONCE_ACTION_EXIT_CODE: ${{ steps.reusable-once.outputs.exit-code }}
          ONCE_ACTION_SCHEMA: ${{ steps.reusable-once.outputs.schema }}
        run: |
          test "$ONCE_ACTION_EXIT_CODE" = 0
          test "$ONCE_ACTION_SCHEMA" = dev.closurelabs.once/doctor/v1

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Check protected policy flake template
        run: nix flake check path:./examples/once-policy --print-build-logs

      - name: Run Once proof of concept
        # The disposable chroot store needs a mount namespace unavailable on
        # the hosted VM itself, so run this isolated step in a pinned container.
        shell: bash
        run: |
          docker run --privileged --rm \
            --env CARGO_TARGET_DIR=/var/tmp/once-target \
            --env ONCE_BIN=/var/tmp/once-target/debug/once \
            --env RUNNER_TEMP=/var \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            nixos/nix@sha256:377d4887aca98f0dfa12971c1ea6d6a625a435d8b610d4c95a436843da6fbfd1 \
            nix --extra-experimental-features 'nix-command flakes ca-derivations' \
            develop path:/workspace -c ./scripts/demo.sh

      - name: Summarize demonstration
        if: always()
        shell: bash
        run: |
          {
            echo '## Once proof-of-concept phases'
            echo
            echo '- Cold trace miss'
            echo '- Signed local build'
            echo '- Native build-trace-v2 cache publication'
            echo '- Expensive artifact deletion'
            echo '- Trace-only local recognition without artifact restoration'
            echo '- Relevant source invalidation'
            echo '- Irrelevant documentation stability'
            echo '- Policy-version invalidation'
          } >> "$GITHUB_STEP_SUMMARY"
