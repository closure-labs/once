[package]
name = "once"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Recognize accepted Nix build-trace realizations"
repository = "https://github.com/closure-labs/once"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

