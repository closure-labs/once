name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Verify policy artifact
        shell: bash
        run: |
          set -euo pipefail
          policy_path="$(nix build .#policy --no-link --print-out-paths)"
          nix store cat "$policy_path" > /tmp/once-policy.toml
          cmp policy.toml /tmp/once-policy.toml
