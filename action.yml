name: Closure Labs Once
description: Apply an immutable Once policy to doctor, check, or run a Nix installable.

inputs:
  command:
    description: Once command to execute (doctor, check, or run).
    required: false
    default: check
  installable:
    description: Nix installable for check or run; omit for doctor.
    required: false
  policy-flake:
    description: Immutable github:OWNER/REPO/COMMIT policy flake reference.
    required: true
  policy-revision:
    description: Full 40-character commit expected from policy flake metadata.
    required: true
  fail-on-nonzero:
    description: Fail the action when Once returns a nonzero policy exit code.
    required: false
    default: "true"
  install-nix:
    description: Install tested Determinate Nix 3.23.3 before invoking Once.
    required: false
    default: "true"

  trace-bundle:
    description: Local directory containing a signed portable bundle (check only).
    required: false
  producer-workflow:
    description: Producer workflow filename or numeric ID; find a matching artifact (check only).
    required: false
  producer-branch:
    description: Protected branch whose successful push runs may supply bundles.
    required: false
    default: main
  github-token:
    description: Read-only token with actions read and contents read for artifact lookup.
    required: false
    default: ${{ github.token }}

outputs:
  cache-hit:
    description: True only when Once accepted the realization.
    value: ${{ steps.once.outputs.cache-hit }}
  decision:
    description: Once decision; a normal absent artifact produces MISS.
    value: ${{ steps.once.outputs.decision }}
  bundle-id:
    description: Stable artifact name for this derivation, output and policy.
    value: ${{ steps.once.outputs.bundle-id }}
  result-json:
    description: Versioned JSON emitted by Once, when the CLI produced a result.
    value: ${{ steps.once.outputs.result-json }}
  schema:
    description: Expected schema URI for result-json.
    value: ${{ steps.once.outputs.schema }}
  exit-code:
    description: Exact Once policy exit code.
    value: ${{ steps.once.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Install Determinate Nix
      if: inputs.install-nix == 'true'
      uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3.23.3
      with:
        extra-conf: |
          experimental-features = nix-command flakes ca-derivations

    - name: Run Once
      id: once
      shell: bash
      env:
        ONCE_ACTION_COMMAND: ${{ inputs.command }}
        ONCE_ACTION_INSTALLABLE: ${{ inputs.installable }}
        ONCE_ACTION_POLICY_FLAKE: ${{ inputs.policy-flake }}
        ONCE_ACTION_POLICY_REVISION: ${{ inputs.policy-revision }}
        ONCE_ACTION_FAIL_ON_NONZERO: ${{ inputs.fail-on-nonzero }}
        ONCE_ACTION_INSTALL_NIX: ${{ inputs.install-nix }}
        ONCE_ACTION_TRACE_BUNDLE: ${{ inputs.trace-bundle }}
        ONCE_ACTION_PRODUCER_WORKFLOW: ${{ inputs.producer-workflow }}
        ONCE_ACTION_PRODUCER_BRANCH: ${{ inputs.producer-branch }}
        ONCE_ACTION_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: bash "$GITHUB_ACTION_PATH/scripts/github-action.sh"

    - name: Enforce Once result
      if: inputs.fail-on-nonzero == 'true' && steps.once.outputs.exit-code != '0'
      shell: bash
      env:
        ONCE_ACTION_EXIT_CODE: ${{ steps.once.outputs.exit-code }}
      run: |
        if [[ "$ONCE_ACTION_EXIT_CODE" =~ ^[0-9]+$ ]]; then
          exit "$ONCE_ACTION_EXIT_CODE"
        fi
        echo "Once did not produce a valid exit code" >&2
        exit 40
